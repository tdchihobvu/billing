<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Change not saved · Billing and Licensing</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { --wine:#8e1b1f; --wine-dark:#2e1214; --sun:#f3b81b; --ink:#211819; --soft:#6f6364; --ground:#faf7f7; --line:#eadcdc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--ground);
           font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color:var(--ink); }
    main { width:100%; max-width:460px; background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden;
           box-shadow:0 20px 50px -24px rgba(46,18,20,.35); }
    .band { position:relative; height:92px; overflow:hidden; background:linear-gradient(160deg,#b0383d,var(--wine-dark)); }
    .band svg { position:absolute; left:50%; bottom:-46px; transform:translateX(-50%); width:120px; height:120px; fill:var(--sun); }
    .body { padding:26px 28px 28px; }
    .code { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--wine); margin:0 0 6px; }
    h1 { font-size:23px; line-height:1.2; margin:0 0 10px; }
    p { margin:0; color:var(--soft); line-height:1.55; font-size:15px; }
    .acts { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    a.b { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:0 16px; border-radius:10px;
           font-weight:600; font-size:14px; text-decoration:none; border:1px solid var(--line); color:var(--ink); background:#fff; }
    a.b.main { background:var(--wine); border-color:var(--wine); color:#fff; }
    a.b:focus-visible { outline:3px solid var(--sun); outline-offset:2px; }
  </style>
</head>
<body>
  <main>
    <div class="band" aria-hidden="true">
      <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="46"/><g><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(0 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(30 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(60 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(90 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(120 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(150 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(180 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(210 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(240 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(270 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(300 100 100)"/><rect x="96" y="18" width="8" height="26" rx="4" transform="rotate(330 100 100)"/></g></svg>
    </div>
    <div class="body">
      <p class="code">Error 422</p>
      <h1>That change wasn't saved</h1>
      <p>The page was open for a long time, or you signed in somewhere else, so it was stopped for your safety. Go back, refresh the page and try again.</p>
      <div class="acts">
        <a class="b main" href="/">Go to the dashboard</a>
        <a class="b" href="javascript:history.back()">Go back</a>
      </div>
    </div>
  </main>
</body>
</html>
