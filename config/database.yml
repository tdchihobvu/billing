# PostgreSQL.
# DATABASE_URL, when set, overrides everything below (Heroku sets it automatically).
# Otherwise the DB_* environment variables are used, falling back to the local
# development defaults (postgres on localhost:5434). Keep real credentials out of this file.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5434 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "zimura_billing_db" } %>
  # Local-only default. Production never falls back to it.
  password: <%= ENV.fetch("DB_PASSWORD") { "admin" } %>

# The test database is erased and regenerated when tests run.
# Never point it at the development or production database.
test:
  <<: *default
  database: billing_test
  password: <%= ENV.fetch("DB_PASSWORD") { "admin" } %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "zimura_billing_db" } %>
  password: <%= ENV["DB_PASSWORD"] %>
  url: <%= ENV["DATABASE_URL"] %>
